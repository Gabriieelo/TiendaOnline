<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce - Proyecto Final</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css.css">
</head>
<body>

    <!-- Encabezado y Navegación -->    
  <header class="sticky-top bg-dark">
        <nav class="navbar navbar-expand-lg navbar-dark container">
            <a class="navbar-brand fw-bold" href="#">MiTienda</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#productos-section">Productos</a>
                    </li>
                    <li class="nav-item">
                        <button type="button" class="btn btn-outline-light position-relative ms-lg-3" id="btn-carrito" data-bs-toggle="offcanvas" data-bs-target="#sidebar-carrito" aria-controls="sidebar-carrito" aria-label="Abrir carrito, 0 productos">
                            🛒 Carrito
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cant-carrito" aria-live="polite" hidden>0</span>
                        </button>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <section id="productos-section">
            <h1 class="text-center mb-4">Catálogo de Productos</h1>

            <div class="row justify-content-center mb-4">
            <div class="col-12 col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-white" id="search-addon">🔍</span>
                    <input
                        type="search"
                        id="input-buscador"
                        class="form-control"
                        placeholder="Buscar productos por nombre..."
                        aria-label="Buscar productos"
                        aria-describedby="search-addon"
                    >
                </div>
            </div>
        </div>

            <div class="d-flex flex-wrap justify-content-center gap-2 mb-4" id="contenedor-categorias">

            </div>

            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="contenedor-productos">

            </div>
        </section>
    </main>

    <!-- Pie de página -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 MiTienda - Todos los derechos reservados</p>
        </div>
    </footer>

    <!-- Modal de detalle de producto (Bootstrap 5) -->
    <div class="modal fade" id="modal-detalle" tabindex="-1" aria-labelledby="modal-titulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="modal-titulo"></h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-4 align-items-center">
                        <div class="col-md-5 modal-img-container">
                            <img id="modal-img" src="" alt="" class="img-fluid">
                        </div>
                        <div class="col-md-7">
                            <span class="modal-categoria" id="modal-categoria"></span>
                            <p id="modal-descripcion"></p>
                            <span class="modal-precio" id="modal-precio"></span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="modal-btn-agregar">Agregar al carrito 🛒</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Punto 5: listado de productos guardados en el carrito -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="sidebar-carrito" aria-labelledby="carrito-titulo">
        <div class="offcanvas-header">
            <h2 class="offcanvas-title fs-5" id="carrito-titulo">Tu carrito 🛒</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar carrito"></button>
        </div>
        <div class="offcanvas-body">
            <p id="carrito-vacio" class="text-muted text-center py-4">Tu carrito está vacío. Agregá productos del catálogo.</p>
            <ul id="lista-carrito" class="list-group list-group-flush"></ul>
        </div>
    </div>

    <!-- Punto 4: confirmación accesible después de guardar el producto -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast-carrito" class="toast" role="status" aria-live="polite" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">MiTienda</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar mensaje"></button>
            </div>
            <div id="mensaje-carrito" class="toast-body"></div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu archivo de JavaScript -->
    <script src="js.js"></script>
</body>
</html>
